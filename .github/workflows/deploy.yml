name: Deploy Laravel to Hostinger

on:
  push:
    branches:
      - main

concurrency:
  group: deployment
  cancel-in-progress: false

env:
  # Path yang benar untuk domain baitulqurancamba.com di Hostinger
  TARGET_DIR: domains/baitulqurancamba.com/public_html

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 1. Setup Node.js & Compile Vite Assets (Tailwind CSS v4)
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Node Dependencies & Build Assets
        run: |
          npm install
          npm run build

      # 2. Upload asset hasil build (public/build) ke folder domain di Hostinger
      - name: 🚀 Upload Compiled Assets (public/build) to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "public/build"
          target: ${{ env.TARGET_DIR }}

      # 3. Jalankan perintah deployment Laravel di Hostinger via SSH
      - name: ⚡ Execute Remote SSH Deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export PATH=/usr/local/bin:/usr/bin:$PATH

            # Masuk ke folder domain yang tepat
            cd ~/${{ env.TARGET_DIR }}

            echo "🚀 Mulai proses deployment di $(pwd)..."

            # Inisialisasi git otomatis jika folder masih baru / belum ada git
            if [ ! -d ".git" ]; then
              echo "Folder belum terhubung git, melakukan inisialisasi awal..."
              git init
              git remote add origin https://github.com/farhanalfarabi/baitulqurancamba-web.git
              git fetch origin main
              git reset --hard origin/main
            else
              # Ambil update kode terbaru
              git fetch origin main
              git reset --hard origin/main
            fi

            # Siapkan file .env jika belum ada
            if [ ! -f ".env" ]; then
              echo "Membuat file .env dari .env.example..."
              cp .env.example .env
              php artisan key:generate --force
            fi

            # 1. Aktifkan maintenance mode
            php artisan down || true

            # 2. Install dependency Composer untuk production
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            # 3. Jalankan migrasi database (toleran jika DB belum diatur di .env)
            php artisan migrate --force || echo "⚠️ Warning: Database migrate dilewati (pastikan kredensial DB di .env sudah sesuai)"

            # 4. Beri izin akses ke folder storage & cache
            chmod -R 775 storage bootstrap/cache || true

            # 5. Refresh cache konfigurasi, route, dan view
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # 6. Pastikan symbolic link storage sudah aktif
            php artisan storage:link || true

            # 7. Matikan maintenance mode
            php artisan up

            echo "✅ Deployment ke Hostinger berhasil di $(pwd)!"
