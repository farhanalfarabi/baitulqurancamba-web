<!-- Interactive Laptop Component: Work In Style / Draggable Stickers -->
<section id="shop" class="py-24 bg-[#FAF7F0] relative overflow-hidden">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    
    <!-- Header -->
    <div class="mb-12">
      <h2 class="font-display font-black text-4xl sm:text-6xl text-[#121212] uppercase tracking-tight">
        Work in <span class="inline-block px-4 py-1.5 bg-[#121212] text-lime rounded-xl border-[2.5px] border-[#121212] brutal-shadow tilt-left transform">Style</span>
      </h2>
      <p class="font-cursive text-3xl sm:text-4xl text-[#E53935] font-bold mt-2">
        design your laptop
      </p>
      <div class="mt-6 flex justify-center">
        <button data-open-modal="waitlist" class="btn-tactile inline-flex items-center gap-3 px-6 py-2.5 rounded-full bg-lime text-[#121212] font-label font-bold text-xs uppercase tracking-wider border-[2px] border-[#121212] brutal-shadow-sm">
          <span>Shop Stickers</span>
          <span class="text-xs">➔</span>
        </button>
      </div>
    </div>

    <!-- Interactive Laptop Surface Mockup -->
    <div class="relative max-w-3xl mx-auto">
      
      <!-- Tooltip Instruction -->
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white border-[2px] border-[#121212] brutal-shadow-sm font-label font-bold text-xs uppercase tracking-wider mb-4">
        <span>🎯</span>
        <span>Drag the stickers to krack your style</span>
      </div>

      <!-- MacBook Lid Surface (Drop Area) -->
      <div id="laptop-surface" class="laptop-lid p-6 min-h-[460px] sm:min-h-[520px]">
        
        <!-- Apple / Center Emblem Silhouette -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-20 pointer-events-none">
          <svg class="w-24 h-24 text-[#121212]" viewBox="0 0 170 170" fill="currentColor">
            <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.04-7.69-7.85-11.97-14.42-6.19-9.5-11.06-20.2-14.61-32.08-3.55-11.89-5.33-23.23-5.33-34.03 0-14.88 3.73-27.18 11.19-36.9 7.46-9.72 16.98-14.71 28.56-14.97 4.13 0 9.07 1.15 14.82 3.45 5.75 2.3 9.4 3.51 10.96 3.63 2.05-.24 5.9-1.52 11.55-3.83 5.65-2.31 10.45-3.34 14.4-3.1 11.08.76 19.98 5.09 26.7 12.99-9.8 5.88-14.58 14.28-14.33 25.21.25 8.92 3.77 16.38 10.56 22.38 4.22 3.78 9.07 6.46 14.55 8.04-1.92 5.91-4.22 11.66-6.88 17.25zM119.22 31.84c0-7.72 2.76-14.79 8.28-21.21 5.52-6.42 12.33-10.3 20.43-11.63.13 1.14.2 2.14.2 3.01 0 7.72-2.89 14.89-8.68 21.51-5.78 6.62-12.53 10.28-20.23 10.99-.13-.88-.2-1.78-.2-2.67z" />
          </svg>
        </div>

        <!-- Laptop Open Notch -->
        <div class="laptop-notch"></div>

        <!-- DRAGGABLE STICKER 1: Mascot Cracker -->
        <div class="draggable-sticker w-24 h-auto top-8 left-8 tilt-left cursor-grab" style="z-index: 10;">
          <img src="./assets/images/mascot-cracker.svg" alt="Cracker Mascot Decal" class="w-full h-auto pointer-events-none drop-shadow-[3px_3px_0px_#121212]">
        </div>

        <!-- DRAGGABLE STICKER 2: Krackerz Van -->
        <div class="draggable-sticker w-36 h-auto bottom-8 left-12 tilt-right cursor-grab" style="z-index: 11;">
          <img src="./assets/images/sticker-van.svg" alt="Krackerz Camper Van Decal" class="w-full h-auto pointer-events-none drop-shadow-[3px_3px_0px_#121212]">
        </div>

        <!-- DRAGGABLE STICKER 3: Trophy -->
        <div class="draggable-sticker w-16 h-auto top-28 left-48 tilt-left cursor-grab" style="z-index: 8;">
          <img src="./assets/images/sticker-trophy.svg" alt="Trophy Decal" class="w-full h-auto pointer-events-none drop-shadow-[3px_3px_0px_#121212]">
        </div>

        <!-- DRAGGABLE STICKER 4: Starburst "Bite Learn Repeat" -->
        <div class="draggable-sticker w-24 h-auto top-12 right-40 tilt-right cursor-grab" style="z-index: 9;">
          <img src="./assets/images/sticker-starburst.svg" alt="Bite Learn Repeat Decal" class="w-full h-auto pointer-events-none drop-shadow-[3px_3px_0px_#121212]">
        </div>

        <!-- DRAGGABLE STICKER 5: "KRACK YOUR CAREER" Badge -->
        <div class="draggable-sticker px-4 py-2 bg-lime text-[#121212] rounded-xl border-[2.5px] border-[#121212] brutal-shadow font-display font-black text-sm uppercase top-16 right-10 tilt-right cursor-grab" style="z-index: 12;">
          KRACK YOUR CAREER
        </div>

        <!-- DRAGGABLE STICKER 6: Lightning Bolt -->
        <div class="draggable-sticker w-14 h-auto bottom-20 right-48 tilt-left cursor-grab" style="z-index: 7;">
          <img src="./assets/images/sticker-lightning.svg" alt="Lightning Decal" class="w-full h-auto pointer-events-none drop-shadow-[3px_3px_0px_#121212]">
        </div>

        <!-- DRAGGABLE STICKER 7: Soda Cup -->
        <div class="draggable-sticker w-14 h-auto bottom-8 right-24 tilt-right cursor-grab" style="z-index: 13;">
          <img src="./assets/images/sticker-soda.svg" alt="Soda Cup Decal" class="w-full h-auto pointer-events-none drop-shadow-[3px_3px_0px_#121212]">
        </div>

        <!-- DRAGGABLE STICKER 8: Graduation Cap -->
        <div class="draggable-sticker w-16 h-auto bottom-24 left-64 tilt-left cursor-grab" style="z-index: 6;">
          <img src="./assets/images/sticker-gradcap.svg" alt="Graduation Cap Decal" class="w-full h-auto pointer-events-none drop-shadow-[3px_3px_0px_#121212]">
        </div>

      </div>

    </div>

  </div>
</section>
