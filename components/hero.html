<!-- Hero Section Component -->
<section class="relative pt-12 pb-24 overflow-hidden">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
    
    <!-- Top Pill Badge -->
    <div class="inline-flex items-center gap-2 px-5 py-2 rounded-full bg-[#121212] text-lime font-label font-bold text-xs uppercase tracking-widest border-[2px] border-[#121212] brutal-shadow-sm mb-8 tilt-left-sm">
      <span class="text-base">🏆</span>
      <span>World's First Sales Course for Designers</span>
    </div>

    <!-- Main Hero Title -->
    <div class="relative max-w-4xl mx-auto mb-8">
      <!-- Floating Mascot on left -->
      <div class="hidden lg:block absolute -left-16 top-0 w-28 h-auto tilt-left animate-bounce" style="animation-duration: 3s;">
        <img src="./assets/images/mascot-cracker.svg" alt="Krackerz Mascot" class="w-full h-auto drop-shadow-[3px_3px_0px_#121212]">
      </div>

      <h1 class="font-display font-black text-5xl sm:text-7xl lg:text-8xl tracking-tight text-[#121212] uppercase leading-[0.95]">
        For the stuff<br>
        they <span class="font-cursive lowercase text-[#E53935] font-bold text-6xl sm:text-8xl lg:text-9xl tracking-normal inline-block transform -rotate-6">don't</span><br>
        teach<br>
        in design<br>
        schools
      </h1>
    </div>

    <!-- Hero Primary CTA -->
    <div class="flex justify-center mb-16">
      <button data-open-modal="waitlist" class="btn-tactile inline-flex items-center gap-4 px-10 py-4 rounded-full bg-lime text-[#121212] font-label font-black text-sm sm:text-base uppercase tracking-wider border-[3px] border-[#121212] brutal-shadow-lg">
        <span>Join Waitlist</span>
        <span class="w-7 h-7 rounded-full bg-[#E53935] text-white flex items-center justify-center text-sm font-black border-[2px] border-[#121212]">➔</span>
      </button>
    </div>

    <!-- 4 Polaroid / Cracker Cards Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-5xl mx-auto">
      
      <!-- Card 1 -->
      <div class="card-hover-lift rounded-2xl bg-white border-[2.5px] border-[#121212] brutal-shadow overflow-hidden text-left p-3 transform -rotate-1">
        <div class="h-56 rounded-xl overflow-hidden border-[2px] border-[#121212] mb-3 bg-[#E8E2D5]">
          <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=600&q=80" alt="Designer interview preparation" class="w-full h-full object-cover">
        </div>
        <div class="p-2">
          <p class="font-display font-bold text-base text-[#121212] leading-snug">Getting ready for my next interview</p>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="card-hover-lift rounded-2xl bg-[#4A0E17] text-white border-[2.5px] border-[#121212] brutal-shadow overflow-hidden text-left p-3 transform rotate-1">
        <div class="h-56 rounded-xl overflow-hidden border-[2px] border-[#121212] mb-3 bg-[#380810]">
          <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=600&q=80" alt="Uplifting design portfolio" class="w-full h-full object-cover">
        </div>
        <div class="p-2">
          <p class="font-display font-bold text-base text-white leading-snug">Uplifting my design portfolio</p>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="card-hover-lift rounded-2xl bg-white border-[2.5px] border-[#121212] brutal-shadow overflow-hidden text-left p-3 transform -rotate-2">
        <div class="h-56 rounded-xl overflow-hidden border-[2px] border-[#121212] mb-3 bg-[#E8E2D5]">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" alt="Cold outreach without cringing" class="w-full h-full object-cover">
        </div>
        <div class="p-2">
          <p class="font-display font-bold text-base text-[#121212] leading-snug">Cold outreaching without cringing</p>
        </div>
      </div>

      <!-- Card 4 -->
      <div class="card-hover-lift rounded-2xl bg-[#4A0E17] text-white border-[2.5px] border-[#121212] brutal-shadow overflow-hidden text-left p-3 transform rotate-2">
        <div class="h-56 rounded-xl overflow-hidden border-[2px] border-[#121212] mb-3 bg-[#380810]">
          <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=600&q=80" alt="Connecting with other designers" class="w-full h-full object-cover">
        </div>
        <div class="p-2">
          <p class="font-display font-bold text-base text-white leading-snug">Connecting with other designers</p>
        </div>
      </div>

    </div>

  </div>
</section>
