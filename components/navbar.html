<!-- Navigation Bar Component -->
<header class="sticky top-0 z-50 bg-white transition-all">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2 sm:py-2.5 flex items-center justify-between">

    <!-- Logo & Identity -->
    <a href="#" class="flex items-center gap-2.5 group focus:outline-none" aria-label="Baitul Qur'an Camba Home">
      <img src="./assets/images/logo.png" alt="Baitul Qur'an Camba Logo"
        class="h-8 sm:h-9 w-auto group-hover:scale-105 transition-transform">
      <div class="hidden sm:flex flex-col text-left">
        <span class="font-display font-black text-xs sm:text-sm leading-none text-[#121212] uppercase tracking-tight">
          BAITUL QUR'AN
        </span>
        <span class="font-label font-bold text-[9px] text-[#4A0E17] tracking-widest uppercase">
          PESANTREN TAHFIZH CAMBA
        </span>
      </div>
    </a>

    <!-- Krackerz Button + Link Wrapper Capsule (Compact & Refined) -->
    <div
      class="hidden lg:flex items-center bg-[#FAF7F0] border border-[#161616] rounded-xl pl-4 pr-1 py-1 shadow-[0_2px_6px_rgba(0,0,0,0.05)]">
      <nav class="flex items-center gap-4 lg:gap-5 font-body font-semibold text-xs text-[#121212] pr-3.5">
        <a href="#curriculum" class="roll-link">
          <span class="roll-link-inner">
            <span>Program</span>
            <span class="text-[#E53935]" aria-hidden="true">Program</span>
          </span>
        </a>
        <a href="#about" class="roll-link">
          <span class="roll-link-inner">
            <span>Tentang Kami</span>
            <span class="text-[#E53935]" aria-hidden="true">Tentang Kami</span>
          </span>
        </a>
        <a href="#pricing" class="roll-link">
          <span class="roll-link-inner">
            <span>Biaya Pendidikan</span>
            <span class="text-[#E53935]" aria-hidden="true">Biaya Pendidikan</span>
          </span>
        </a>
        <a href="#curriculum" class="roll-link">
          <span class="roll-link-inner">
            <span>Kehidupan Santri</span>
            <span class="text-[#E53935]" aria-hidden="true">Kehidupan Santri</span>
          </span>
        </a>
        <a href="#faq" class="roll-link">
          <span class="roll-link-inner">
            <span>FAQ</span>
            <span class="text-[#E53935]" aria-hidden="true">FAQ</span>
          </span>
        </a>
      </nav>

      <!-- Signature Krackerz Double-Layer Primary Button (Compact) -->
      <button data-open-modal="waitlist"
        class="bg-white p-0.5 rounded-lg shadow-sm inline-flex items-center transition-transform hover:scale-[1.02] active:scale-[0.98] cursor-pointer focus:outline-none">
        <div
          class="bg-lime text-[#121212] border-[1.5px] border-[#161616] rounded-md px-3 py-1.5 flex items-center gap-2 font-display font-black text-[11px] uppercase tracking-wider">
          <span class="roll-link">
            <span class="roll-link-inner">
              <span>DAFTAR SEKARANG</span>
              <span class="text-[#121212]" aria-hidden="true">DAFTAR SEKARANG</span>
            </span>
          </span>
          <span
            class="w-4 h-4 rounded-full bg-[#E53935] text-white flex items-center justify-center text-[9px] font-black">➔</span>
        </div>
      </button>
    </div>

    <!-- Mobile Menu Hamburger Button -->
    <button id="btn-mobile-menu" aria-label="Toggle navigation menu" aria-expanded="false"
      class="lg:hidden p-1.5 rounded-lg border border-[#161616] bg-white shadow-sm btn-tactile">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

  </div>

  <!-- Mobile Navigation Drawer -->
  <div id="mobile-nav" class="hidden lg:hidden border-t border-[#161616] bg-[#FAF7F0] px-6 py-6 space-y-4">
    <a href="#curriculum" class="roll-link block font-body font-semibold text-base text-[#121212]">
      <span class="roll-link-inner">
        <span>Program</span>
        <span class="text-[#E53935]" aria-hidden="true">Program</span>
      </span>
    </a>
    <a href="#about" class="roll-link block font-body font-semibold text-base text-[#121212]">
      <span class="roll-link-inner">
        <span>Tentang Kami</span>
        <span class="text-[#E53935]" aria-hidden="true">Tentang Kami</span>
      </span>
    </a>
    <a href="#pricing" class="roll-link block font-body font-semibold text-base text-[#121212]">
      <span class="roll-link-inner">
        <span>Biaya Pendidikan</span>
        <span class="text-[#E53935]" aria-hidden="true">Biaya Pendidikan</span>
      </span>
    </a>
    <a href="#curriculum" class="roll-link block font-body font-semibold text-base text-[#121212]">
      <span class="roll-link-inner">
        <span>Kehidupan Santri</span>
        <span class="text-[#E53935]" aria-hidden="true">Kehidupan Santri</span>
      </span>
    </a>
    <a href="#faq" class="roll-link block font-body font-semibold text-base text-[#121212]">
      <span class="roll-link-inner">
        <span>FAQ</span>
        <span class="text-[#E53935]" aria-hidden="true">FAQ</span>
      </span>
    </a>
    <div class="pt-2">
      <button data-open-modal="waitlist"
        class="w-full bg-white p-1 rounded-xl shadow-sm flex items-center justify-center transition-transform hover:scale-[1.02] active:scale-[0.98] cursor-pointer focus:outline-none">
        <div
          class="w-full bg-lime text-[#121212] border-2 border-[#161616] rounded-lg px-4 py-2.5 flex items-center justify-center gap-2.5 font-display font-black text-xs uppercase tracking-wider">
          <span>DAFTAR SEKARANG</span>
          <span
            class="w-5 h-5 rounded-full bg-[#E53935] text-white flex items-center justify-center text-[10px] font-black">➔</span>
        </div>
      </button>
    </div>
  </div>
</header>
