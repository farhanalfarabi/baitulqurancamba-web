<!-- Navigation Bar Component -->
<header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md transition-all">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
    
    <!-- Logo -->
    <a href="#" class="flex items-center gap-2 group focus:outline-none" aria-label="Krackerz Home">
      <img src="./assets/images/logo-krackerz.svg" alt="Krackerz Logo" class="h-10 w-auto group-hover:scale-105 transition-transform">
    </a>

    <!-- Pill Navbar Capsule (Exact Design Matching Provided Reference Image) -->
    <div class="hidden lg:flex items-center bg-[#FAF7F0] border-[1.5px] border-[#121212] rounded-full pl-8 pr-1.5 py-1.5 shadow-[0_4px_16px_rgba(0,0,0,0.06)]">
      <nav class="flex items-center gap-8 font-body font-semibold text-[14px] text-[#121212] pr-7">
        <a href="#curriculum" class="roll-link">
          <span class="roll-link-inner">
            <span>Features</span>
            <span class="text-[#E53935]" aria-hidden="true">Features</span>
          </span>
        </a>
        <a href="#pricing" class="roll-link">
          <span class="roll-link-inner">
            <span>Pricing</span>
            <span class="text-[#E53935]" aria-hidden="true">Pricing</span>
          </span>
        </a>
        <a href="#partner" class="roll-link">
          <span class="roll-link-inner">
            <span>For partners</span>
            <span class="text-[#E53935]" aria-hidden="true">For partners</span>
          </span>
        </a>
        <a href="#faq" class="roll-link">
          <span class="roll-link-inner">
            <span>FAQ</span>
            <span class="text-[#E53935]" aria-hidden="true">FAQ</span>
          </span>
        </a>
        <a href="#shop" class="roll-link">
          <span class="roll-link-inner">
            <span>Shop</span>
            <span class="text-[#E53935]" aria-hidden="true">Shop</span>
          </span>
        </a>
      </nav>

      <!-- Pill Button inside Capsule (Stationary button, rolling text, spinning scallop border) -->
      <button data-open-modal="waitlist" class="group flex items-center gap-2.5 px-6 py-2.5 rounded-2xl bg-lime text-[#121212] font-display font-black text-sm uppercase tracking-tight border-[2px] border-[#121212] shadow-[2px_3px_0px_#121212] cursor-pointer focus:outline-none">
        <span class="roll-link">
          <span class="roll-link-inner">
            <span>JOIN WAITLIST</span>
            <span class="text-[#121212]" aria-hidden="true">JOIN WAITLIST</span>
          </span>
        </span>
        <!-- Scalloped Badge with Spinning Border -->
        <div class="relative w-6 h-6 flex items-center justify-center flex-shrink-0">
          <svg class="w-6 h-6 badge-spin-border" viewBox="0 0 40 40" fill="none">
            <path d="M 20 2 
                     C 22.5 2, 24 4.5, 26 5
                     C 28 5.5, 30.5 4.5, 32 6
                     C 33.5 7.5, 32.5 10, 33 12
                     C 33.5 14, 36 15.5, 36 18
                     C 36 20.5, 34 22, 33.5 24
                     C 33 26, 34 28.5, 32.5 30
                     C 31 31.5, 28.5 30.5, 26.5 31
                     C 24.5 31.5, 23 34, 20.5 34
                     C 18 34, 16.5 31.5, 14.5 31
                     C 12.5 30.5, 10 31.5, 8.5 30
                     C 7 28.5, 8 26, 7.5 24
                     C 7 22, 5 20.5, 5 18
                     C 5 15.5, 7.5 14, 8 12
                     C 8.5 10, 7.5 7.5, 9 6
                     C 10.5 4.5, 13 5.5, 15 5
                     C 17 4.5, 18.5 2, 20 2 Z"
                  fill="#E53935" stroke="#121212" stroke-width="2" stroke-linejoin="round"/>
          </svg>
          <svg class="absolute inset-0 w-6 h-6 pointer-events-none" viewBox="0 0 40 40" fill="none">
            <path d="M 14 18 L 26 18 M 21 13 L 26 18 L 21 23" 
                  stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </button>
    </div>

    <!-- Mobile Menu Hamburger Button -->
    <button id="btn-mobile-menu" aria-label="Toggle navigation menu" aria-expanded="false" class="lg:hidden p-2.5 rounded-xl border-[2px] border-[#121212] bg-white brutal-shadow-sm btn-tactile">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

  </div>

  <!-- Mobile Navigation Drawer -->
  <div id="mobile-nav" class="hidden lg:hidden border-t-[2.5px] border-[#121212] bg-[#FAF7F0] px-6 py-6 space-y-4">
    <a href="#curriculum" class="roll-link block font-body font-semibold text-base text-[#121212]">
      <span class="roll-link-inner">
        <span>Features</span>
        <span class="text-[#E53935]" aria-hidden="true">Features</span>
      </span>
    </a>
    <a href="#pricing" class="roll-link block font-body font-semibold text-base text-[#121212]">
      <span class="roll-link-inner">
        <span>Pricing</span>
        <span class="text-[#E53935]" aria-hidden="true">Pricing</span>
      </span>
    </a>
    <a href="#partner" class="roll-link block font-body font-semibold text-base text-[#121212]">
      <span class="roll-link-inner">
        <span>For partners</span>
        <span class="text-[#E53935]" aria-hidden="true">For partners</span>
      </span>
    </a>
    <a href="#faq" class="roll-link block font-body font-semibold text-base text-[#121212]">
      <span class="roll-link-inner">
        <span>FAQ</span>
        <span class="text-[#E53935]" aria-hidden="true">FAQ</span>
      </span>
    </a>
    <a href="#shop" class="roll-link block font-body font-semibold text-base text-[#121212]">
      <span class="roll-link-inner">
        <span>Shop</span>
        <span class="text-[#E53935]" aria-hidden="true">Shop</span>
      </span>
    </a>
    <div class="pt-2">
      <button data-open-modal="waitlist" class="group w-full flex items-center justify-center gap-2.5 px-6 py-3 rounded-2xl bg-lime text-[#121212] font-display font-black text-sm uppercase tracking-tight border-[2px] border-[#121212] shadow-[2px_3px_0px_#121212] cursor-pointer focus:outline-none">
        <span class="roll-link">
          <span class="roll-link-inner">
            <span>JOIN WAITLIST</span>
            <span class="text-[#121212]" aria-hidden="true">JOIN WAITLIST</span>
          </span>
        </span>
        <!-- Scalloped Badge with Spinning Border -->
        <div class="relative w-6 h-6 flex items-center justify-center flex-shrink-0">
          <svg class="w-6 h-6 badge-spin-border" viewBox="0 0 40 40" fill="none">
            <path d="M 20 2 
                     C 22.5 2, 24 4.5, 26 5
                     C 28 5.5, 30.5 4.5, 32 6
                     C 33.5 7.5, 32.5 10, 33 12
                     C 33.5 14, 36 15.5, 36 18
                     C 36 20.5, 34 22, 33.5 24
                     C 33 26, 34 28.5, 32.5 30
                     C 31 31.5, 28.5 30.5, 26.5 31
                     C 24.5 31.5, 23 34, 20.5 34
                     C 18 34, 16.5 31.5, 14.5 31
                     C 12.5 30.5, 10 31.5, 8.5 30
                     C 7 28.5, 8 26, 7.5 24
                     C 7 22, 5 20.5, 5 18
                     C 5 15.5, 7.5 14, 8 12
                     C 8.5 10, 7.5 7.5, 9 6
                     C 10.5 4.5, 13 5.5, 15 5
                     C 17 4.5, 18.5 2, 20 2 Z"
                  fill="#E53935" stroke="#121212" stroke-width="2" stroke-linejoin="round"/>
          </svg>
          <svg class="absolute inset-0 w-6 h-6 pointer-events-none" viewBox="0 0 40 40" fill="none">
            <path d="M 14 18 L 26 18 M 21 13 L 26 18 L 21 23" 
                  stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </button>
    </div>
  </div>
</header>
