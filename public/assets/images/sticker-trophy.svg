<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- BQC Bespoke Sticker: Tumpukan Kitab Kuning Turath Klasik & Qalam -->
  <defs>
    <filter id="kitabTurathShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#121212" />
    </filter>
  </defs>

  <g filter="url(#kitabTurathShadow)">
    <!-- Bottom Book: Kitab Fiqh (Deep Wine #7C1A06) -->
    <g id="book-bottom">
      <!-- Book Pages Block -->
      <path d="M20 74 L82 74 L84 88 L18 88 Z" fill="#FBF8EE" stroke="#121212" stroke-width="2.5"/>
      <line x1="82" y1="78" x2="22" y2="78" stroke="#E2D9C2" stroke-width="1.5"/>
      <line x1="82" y1="83" x2="21" y2="83" stroke="#E2D9C2" stroke-width="1.5"/>
      <!-- Book Spine (Left Curved Edge) -->
      <path d="M18 72 C12 72 10 76 10 81 C10 86 12 90 18 90 L24 90 L24 72 Z" fill="#7C1A06" stroke="#121212" stroke-width="2.5"/>
      <!-- Book Cover (Top & Bottom Flaps) -->
      <path d="M18 72 L86 72 L84 76 L18 76 Z" fill="#7C1A06" stroke="#121212" stroke-width="2"/>
      <path d="M18 86 L86 86 L84 90 L18 90 Z" fill="#7C1A06" stroke="#121212" stroke-width="2"/>
      <!-- Gold Tooling on Spine -->
      <rect x="13" y="75" width="8" height="2" fill="#F59E0B"/>
      <rect x="13" y="85" width="8" height="2" fill="#F59E0B"/>
    </g>

    <!-- Middle Book: Kitab Hadits (Forest Emerald Green #15803D) -->
    <g id="book-middle">
      <!-- Book Pages Block -->
      <path d="M24 56 L86 56 L88 70 L22 70 Z" fill="#FFFDF5" stroke="#121212" stroke-width="2.5"/>
      <line x1="85" y1="60" x2="26" y2="60" stroke="#E2D9C2" stroke-width="1.5"/>
      <line x1="85" y1="65" x2="25" y2="65" stroke="#E2D9C2" stroke-width="1.5"/>
      <!-- Book Spine -->
      <path d="M22 54 C16 54 14 58 14 63 C14 68 16 72 22 72 L28 72 L28 54 Z" fill="#15803D" stroke="#121212" stroke-width="2.5"/>
      <!-- Book Cover Flaps -->
      <path d="M22 54 L90 54 L88 58 L22 58 Z" fill="#15803D" stroke="#121212" stroke-width="2"/>
      <!-- Gold Embossed Medallion on Spine -->
      <circle cx="20" cy="63" r="2.5" fill="#D4FF00" stroke="#121212" stroke-width="1"/>
    </g>

    <!-- Top Book: Kitab Nahwu & Sharaf (Vermilion Crimson #CF2B09) -->
    <g id="book-top" transform="rotate(-4 50 44)">
      <!-- Book Pages Block -->
      <path d="M22 38 L82 38 L84 52 L20 52 Z" fill="#FFFDF5" stroke="#121212" stroke-width="2.5"/>
      <!-- Book Spine -->
      <path d="M20 36 C14 36 12 40 12 45 C12 50 14 54 20 54 L26 54 L26 36 Z" fill="#CF2B09" stroke="#121212" stroke-width="2.5"/>
      <!-- Top Cover Flat -->
      <path d="M20 36 L84 36 L82 40 L20 40 Z" fill="#CF2B09" stroke="#121212" stroke-width="2"/>
      <!-- Gold Arabic Calligraphy Filigree on Top Spine -->
      <line x1="16" y1="41" x2="22" y2="41" stroke="#F59E0B" stroke-width="1.5"/>
      <line x1="15" y1="45" x2="23" y2="45" stroke="#F59E0B" stroke-width="2"/>
      <line x1="16" y1="49" x2="22" y2="49" stroke="#F59E0B" stroke-width="1.5"/>
      <!-- Red Silk Bookmark Ribbon Flowing Out -->
      <path d="M78 40 C84 46 76 56 82 66 L78 64 L74 67 L76 54 C74 48 76 42 78 40 Z" fill="#D4FF00" stroke="#121212" stroke-width="1.5"/>
    </g>

    <!-- Traditional Calligraphy Reed Pen (Qalam) resting diagonally -->
    <g transform="translate(14, 10) rotate(32 30 30)">
      <!-- Wooden Shaft -->
      <rect x="28" y="4" width="7" height="66" rx="2" fill="#D97706" stroke="#121212" stroke-width="2.5"/>
      <!-- Thread Wrap / Grip Ring -->
      <rect x="28" y="24" width="7" height="6" fill="#121212"/>
      <line x1="28" y1="27" x2="35" y2="27" stroke="#D4FF00" stroke-width="1"/>
      <!-- Slanted Carved Reed Nib -->
      <path d="M28 70 L31.5 82 L35 70 Z" fill="#B45309" stroke="#121212" stroke-width="2"/>
      <!-- Ink Tip (Black) -->
      <path d="M30 78 L31.5 82 L33 78 Z" fill="#121212"/>
    </g>

    <!-- Ink Droplet of Knowledge -->
    <path d="M84 28 C84 28 80 34 80 37 C80 39.2 81.8 41 84 41 C86.2 41 88 39.2 88 37 C88 34 84 28 84 28 Z" fill="#121212"/>

    <!-- Radiant Sparks of Wisdom -->
    <polygon points="56,12 57,15 60,16 57,17 56,20 55,17 52,16 55,15" fill="#F59E0B"/>
    <polygon points="34,16 35,18 37,19 35,20 34,22 33,20 31,19 33,18" fill="#D4FF00"/>
  </g>
</svg>
