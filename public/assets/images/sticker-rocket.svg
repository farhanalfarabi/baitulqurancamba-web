<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" fill="none">
  <!-- BQC Bespoke Sticker: Busur & Anak Panah Sunnah (Traditional Sunnah Archery) -->
  <defs>
    <filter id="archerySunnahShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#121212" />
    </filter>
  </defs>

  <g filter="url(#archerySunnahShadow)">
    <!-- Circular Target Shield in Background -->
    <g transform="translate(62, 28)">
      <circle cx="0" cy="0" r="18" fill="#FFFDF0" stroke="#121212" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="13" fill="#D4FF00" stroke="#121212" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" fill="#CF2B09" stroke="#121212" stroke-width="2"/>
      <circle cx="0" cy="0" r="3" fill="#121212"/>
      <!-- Target 8-Point Star Medallion -->
      <polygon points="0,-4 1,-1 4,0 1,1 0,4 -1,1 -4,0 -1,-1" fill="#F59E0B"/>
    </g>

    <!-- Traditional Recurve Composite Bow (Angled 45 deg) -->
    <g transform="rotate(-45 45 45)">
      <!-- Bow Upper & Lower Limbs (Curved Wood) -->
      <path d="
        M 12 45 
        C 18 36, 26 28, 38 24
        C 46 22, 54 26, 60 16
        L 64 18
        C 58 30, 48 28, 38 32
        C 28 36, 22 42, 16 45 Z
      " fill="#B45309" stroke="#121212" stroke-width="2.5"/>

      <path d="
        M 12 45 
        C 18 54, 26 62, 38 66
        C 46 68, 54 64, 60 74
        L 64 72
        C 58 60, 48 62, 38 58
        C 28 54, 22 48, 16 45 Z
      " fill="#B45309" stroke="#121212" stroke-width="2.5"/>

      <!-- Leather Grip Center -->
      <rect x="11" y="40" width="8" height="10" rx="2" fill="#121212" stroke="#121212" stroke-width="1.5"/>
      <line x1="11" y1="43" x2="19" y2="43" stroke="#D4FF00" stroke-width="1.5"/>
      <line x1="11" y1="47" x2="19" y2="47" stroke="#D4FF00" stroke-width="1.5"/>

      <!-- Bow Tips (Ears / Syahs) -->
      <polygon points="60,16 64,18 68,14 62,12" fill="#D4FF00" stroke="#121212" stroke-width="1.5"/>
      <polygon points="60,74 64,72 68,76 62,78" fill="#D4FF00" stroke="#121212" stroke-width="1.5"/>

      <!-- Taut Bowstring (Drawn Back to Center) -->
      <path d="M64 16 L22 45 L64 74" stroke="#121212" stroke-width="2" fill="none"/>

      <!-- Nocked Arrow Ready to Launch -->
      <!-- Arrow Shaft (Wooden) -->
      <line x1="20" y1="45" x2="80" y2="45" stroke="#121212" stroke-width="3" stroke-linecap="round"/>
      <line x1="22" y1="45" x2="74" y2="45" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

      <!-- Broadhead Arrow Tip -->
      <polygon points="76,41 86,45 76,49 78,45" fill="#FFFFFF" stroke="#121212" stroke-width="2" stroke-linejoin="round"/>

      <!-- Feather Fletching (Crimson & Lime) -->
      <polygon points="26,45 32,39 40,39 34,45" fill="#CF2B09" stroke="#121212" stroke-width="1.5"/>
      <polygon points="26,45 32,51 40,51 34,45" fill="#CF2B09" stroke="#121212" stroke-width="1.5"/>
      <line x1="33" y1="42" x2="37" y2="42" stroke="#FFFFFF" stroke-width="1"/>
      <line x1="33" y1="48" x2="37" y2="48" stroke="#FFFFFF" stroke-width="1"/>
    </g>

    <!-- Speed Streaks & Bullseye Sparkles -->
    <line x1="12" y1="76" x2="24" y2="64" stroke="#D4FF00" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="84" x2="32" y2="72" stroke="#CF2B09" stroke-width="2.5" stroke-linecap="round"/>

    <polygon points="78,16 79,19 82,20 79,21 78,24 77,21 74,20 77,19" fill="#D4FF00"/>
    <polygon points="18,22 19,24 21,25 19,26 18,28 17,26 15,25 17,24" fill="#F59E0B"/>
  </g>
</svg>
