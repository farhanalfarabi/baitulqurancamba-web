<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" fill="none">
  <!-- BQC Bespoke Sticker: Kuda Pacu Sunnah (Noble Sunnah Equestrian) -->
  <defs>
    <filter id="horseSunnahShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#121212" />
    </filter>
  </defs>

  <g filter="url(#horseSunnahShadow)">
    <!-- Background Dynamic Speed / Aura Badge (Electric Lime #D4FF00) -->
    <path d="M20 50 C20 26 40 10 75 10 L140 10 C148 10 152 16 150 24 L142 66 C140 76 130 84 120 84 L50 84 C30 84 20 70 20 50 Z" 
          fill="#D4FF00" stroke="#121212" stroke-width="4" stroke-linejoin="round"/>

    <!-- Speed Dash Lines (Left Side) -->
    <line x1="8" y1="36" x2="22" y2="36" stroke="#121212" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="48" x2="26" y2="48" stroke="#121212" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="16" y1="60" x2="28" y2="60" stroke="#121212" stroke-width="3" stroke-linecap="round"/>

    <!-- Noble Horse Head & Neck Silhouette (Crisp White #FFFFFF) -->
    <g id="horse-head">
      <!-- Neck Base -->
      <path d="M125 80 C118 64 108 50 104 38 C102 32 98 22 96 16 L84 22 C84 22 86 14 82 14 C78 14 74 22 72 26 C68 28 58 32 50 42 C44 48 38 52 32 54 C28 56 30 62 36 62 C42 62 50 58 56 62 C58 70 66 78 78 80 Z" 
            fill="#FFFFFF" stroke="#121212" stroke-width="3.5" stroke-linejoin="round"/>

      <!-- Muzzle / Snout -->
      <path d="M32 54 C30 56 30 60 36 62 C42 62 48 58 54 59" stroke="#121212" stroke-width="2.5" fill="none"/>
      <!-- Nostril -->
      <ellipse cx="38" cy="57" rx="2.5" ry="1.8" fill="#121212" transform="rotate(-15 38 57)"/>

      <!-- Eye (Spirited, Focused, Proud) -->
      <ellipse cx="60" cy="42" rx="4.5" ry="3.5" fill="#121212" transform="rotate(-10 60 42)"/>
      <circle cx="61.5" cy="41" r="1.2" fill="#FFFFFF"/>
      <path d="M55 38 C58 36 63 36 66 39" stroke="#121212" stroke-width="2" fill="none"/>

      <!-- Horse Ears -->
      <path d="M84 22 L86 12 C86 9 82 9 80 14 Z" fill="#FFFFFF" stroke="#121212" stroke-width="2.5"/>
      <path d="M80 18 L76 10 C76 8 72 9 72 14 Z" fill="#F4F4F5" stroke="#121212" stroke-width="2.5"/>

      <!-- Flowing Windblown Mane (Black & Lime Strands) -->
      <path d="M86 16 C94 22 98 32 108 34 C100 36 94 36 92 40 C102 44 106 52 118 54 C110 56 104 56 102 62 C114 66 118 74 128 78 L124 80 C114 76 104 68 98 56 C94 48 90 38 88 28 Z" 
            fill="#121212" stroke="#121212" stroke-width="2"/>
      <!-- Mane Highlights -->
      <path d="M96 26 C102 32 106 40 112 42" stroke="#D4FF00" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M102 48 C108 54 112 60 118 64" stroke="#D4FF00" stroke-width="2.5" stroke-linecap="round" fill="none"/>

      <!-- Ceremonial Islamic Bridle / Harness (Vermilion Crimson #CF2B09) -->
      <!-- Crownpiece strap -->
      <path d="M74 25 L68 46 L62 58" stroke="#CF2B09" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- Noseband strap -->
      <path d="M48 52 L58 60" stroke="#CF2B09" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- Browband strap -->
      <path d="M68 35 L76 34" stroke="#CF2B09" stroke-width="3" stroke-linecap="round" fill="none"/>
      
      <!-- Gold Harness Medallion (Islamic Star Stud) -->
      <circle cx="68" cy="46" r="4.5" fill="#F59E0B" stroke="#121212" stroke-width="2"/>
      <polygon points="68,43 69,45 71,46 69,47 68,49 67,47 65,46 67,45" fill="#121212"/>
    </g>

    <!-- Sunnah Badge Stamp (Right Bottom) -->
    <g transform="translate(94, 60)">
      <rect x="0" y="0" width="46" height="18" rx="4" fill="#CF2B09" stroke="#121212" stroke-width="2"/>
      <text x="23" y="13" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="9" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
        SUNNAH
      </text>
    </g>

    <!-- Sparkle Stars -->
    <polygon points="138,20 139,23 142,24 139,25 138,28 137,25 134,24 137,23" fill="#F59E0B"/>
    <polygon points="50,18 51,20 53,21 51,22 50,24 49,22 47,21 49,20" fill="#FFFFFF"/>
  </g>
</svg>
