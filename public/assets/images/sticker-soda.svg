<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 110" fill="none">
  <!-- BQC Bespoke Sticker: Tasbih Zikir Butir Kayu & Rumbai Sutra -->
  <defs>
    <filter id="tasbihZikirShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#121212" />
    </filter>
  </defs>

  <g filter="url(#tasbihZikirShadow)">
    <!-- Central Sacred Mihrab Arch Frame (Subtle Background) -->
    <path d="M16 52 C16 26 26 12 40 12 C54 12 64 26 64 52 Z" fill="#FAF7F0" stroke="#121212" stroke-width="2" stroke-dasharray="2 2"/>

    <!-- Tasbih Wooden Beads Loop (Oval / Heart-shaped Garland) -->
    <!-- Beads arranged along path -->
    <!-- Top Left Arch Beads -->
    <circle cx="34" cy="18" r="4" fill="#B45309" stroke="#121212" stroke-width="1.8"/>
    <circle cx="26" cy="24" r="4" fill="#B45309" stroke="#121212" stroke-width="1.8"/>
    <circle cx="20" cy="32" r="4" fill="#B45309" stroke="#121212" stroke-width="1.8"/>
    <circle cx="16" cy="42" r="4" fill="#B45309" stroke="#121212" stroke-width="1.8"/>
    <circle cx="16" cy="52" r="4" fill="#B45309" stroke="#121212" stroke-width="1.8"/>
    
    <!-- Gold Separator Bead (Marja') Left -->
    <rect x="14" y="60" width="8" height="4" rx="2" fill="#F59E0B" stroke="#121212" stroke-width="1.5"/>

    <!-- Bottom Left Beads curving to center -->
    <circle cx="20" cy="70" r="4" fill="#B45309" stroke="#121212" stroke-width="1.8"/>
    <circle cx="26" cy="76" r="4" fill="#B45309" stroke="#121212" stroke-width="1.8"/>
    <circle cx="34" cy="80" r="4" fill="#B45309" stroke="#121212" stroke-width="1.8"/>

    <!-- Top Right Arch Beads -->
    <circle cx="46" cy="18" r="4" fill="#B45309" stroke="#121212" stroke-width="1.8"/>
    <circle cx="54" cy="24" r="4" fill="#B45309" stroke="#121212" stroke-width="1.8"/>
    <circle cx="60" cy="32" r="4" fill="#B45309" stroke="#121212" stroke-width="1.8"/>
    <circle cx="64" cy="42" r="4" fill="#B45309" stroke="#121212" stroke-width="1.8"/>
    <circle cx="64" cy="52" r="4" fill="#B45309" stroke="#121212" stroke-width="1.8"/>

    <!-- Gold Separator Bead (Marja') Right -->
    <rect x="58" y="60" width="8" height="4" rx="2" fill="#F59E0B" stroke="#121212" stroke-width="1.5"/>

    <!-- Bottom Right Beads curving to center -->
    <circle cx="60" cy="70" r="4" fill="#B45309" stroke="#121212" stroke-width="1.8"/>
    <circle cx="54" cy="76" r="4" fill="#B45309" stroke="#121212" stroke-width="1.8"/>
    <circle cx="46" cy="80" r="4" fill="#B45309" stroke="#121212" stroke-width="1.8"/>

    <!-- Beads Highlights (Gloss Glints) -->
    <circle cx="19" cy="31" r="1.2" fill="#FFFFFF"/>
    <circle cx="15" cy="41" r="1.2" fill="#FFFFFF"/>
    <circle cx="61" cy="31" r="1.2" fill="#FFFFFF"/>
    <circle cx="65" cy="41" r="1.2" fill="#FFFFFF"/>

    <!-- Main Head Minaret Bead (Imam / Yad) at Intersection -->
    <g transform="translate(40, 80)">
      <!-- Central joining bead -->
      <circle cx="0" cy="2" r="4.5" fill="#121212" stroke="#121212" stroke-width="1.5"/>
      <!-- Tapered Minaret Spire Bead -->
      <polygon points="-3,5 3,5 2,14 -2,14" fill="#F59E0B" stroke="#121212" stroke-width="1.5"/>
      <rect x="-3" y="14" width="6" height="3" rx="1" fill="#D4FF00" stroke="#121212" stroke-width="1"/>

      <!-- Ornate Silk Tassel (Rumbai Zikir) -->
      <!-- Tassel Head Knot -->
      <ellipse cx="0" cy="18" rx="4" ry="2.5" fill="#CF2B09" stroke="#121212" stroke-width="1.5"/>
      <!-- Flowing Silk Tassel Skirt -->
      <path d="M-4 20 L-6 32 L6 32 L4 20 Z" fill="#CF2B09" stroke="#121212" stroke-width="2" stroke-linejoin="round"/>
      <!-- Tassel Fringes / Threads -->
      <line x1="-3" y1="21" x2="-4" y2="31" stroke="#D4FF00" stroke-width="1"/>
      <line x1="0" y1="21" x2="0" y2="31" stroke="#D4FF00" stroke-width="1"/>
      <line x1="3" y1="21" x2="4" y2="31" stroke="#D4FF00" stroke-width="1"/>
    </g>

    <!-- Golden Crescent Moon Medallion in Center of Tasbih Loop -->
    <g transform="translate(40, 44)">
      <circle cx="0" cy="0" r="9" fill="#D4FF00" stroke="#121212" stroke-width="2"/>
      <path d="M2 -6 C-2 -6 -5 -3 -5 0 C-5 3 -2 6 2 6 C4 6 5.5 5 6 4 C3 4.2 1 2.5 1 0 C1 -2.5 3 -4.2 6 -4 C5.5 -5 4 -6 2 -6 Z" fill="#121212"/>
      <polygon points="3,-1 3.5,0 4.5,0.2 3.8,0.8 4,1.8 3.2,1.2 2.4,1.8 2.6,0.8 2,0.2 2.8,0" fill="#121212"/>
    </g>

    <!-- Sacred Dhikr Sparkles -->
    <polygon points="26,8 27,10 29,11 27,12 26,14 25,12 23,11 25,10" fill="#F59E0B"/>
    <polygon points="54,8 55,10 57,11 55,12 54,14 53,12 51,11 53,10" fill="#F59E0B"/>
  </g>
</svg>
