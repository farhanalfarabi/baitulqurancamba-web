<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" fill="none">
  <!-- Mascot Letter C for Camba (Baitul Qur'an Camba) -->
  <defs>
    <filter id="bqcCShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#121212" />
    </filter>
  </defs>

  <g filter="url(#bqcCShadow)">
    <!-- Main Chunky 'C' Body -->
    <path d="
      M 122 46
      C 114 36, 102 28, 88 26
      C 66 23, 44 32, 32 48
      C 18 66, 18 96, 32 116
      C 46 134, 70 142, 92 138
      C 106 135, 118 126, 126 114
      C 128 110, 124 104, 118 102
      C 112 100, 107 104, 102 109
      C 90 119, 72 121, 58 112
      C 46 104, 42 88, 44 76
      C 46 64, 54 50, 68 44
      C 80 39, 96 42, 106 50
      C 111 54, 118 53, 122 48
      C 124 46, 124 45, 122 46 Z
    " fill="#CF2B09" stroke="#121212" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Subtle Islamic Star Pattern Dots on Body -->
    <circle cx="56" cy="38" r="3" fill="#FFE082" stroke="#121212" stroke-width="1.5"/>
    <circle cx="34" cy="62" r="3" fill="#FFE082" stroke="#121212" stroke-width="1.5"/>
    <circle cx="30" cy="98" r="3" fill="#FFE082" stroke="#121212" stroke-width="1.5"/>
    <circle cx="50" cy="128" r="3" fill="#FFE082" stroke="#121212" stroke-width="1.5"/>
    <circle cx="84" cy="134" r="3" fill="#FFE082" stroke="#121212" stroke-width="1.5"/>
    <circle cx="112" cy="122" r="3" fill="#FFE082" stroke="#121212" stroke-width="1.5"/>

    <!-- Crescent Moon & Star inside the 'C' cavity -->
    <g transform="translate(86, 70)">
      <!-- Golden Crescent Moon -->
      <path d="M14 0 C6 0 0 7 0 16 C0 25 7 32 16 32 C21 32 25 30 28 26 C21 27 14 23 12 16 C10 9 15 3 22 1 C19 0.3 16 0 14 0 Z" 
            fill="#D4FF00" stroke="#121212" stroke-width="2.5"/>
      <!-- Golden 8-Point Rub el Hizb Star -->
      <g transform="translate(24, 6)">
        <polygon points="6,0 8,4 12,6 8,8 6,12 4,8 0,6 4,4" fill="#F59E0B" stroke="#121212" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Big Cartoon Santri Eyes -->
    <!-- Left Eye -->
    <circle cx="68" cy="58" r="11" fill="#FFFFFF" stroke="#121212" stroke-width="3.5"/>
    <circle cx="66" cy="58" r="6" fill="#121212"/>
    <circle cx="68" cy="56" r="2" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <circle cx="94" cy="58" r="11" fill="#FFFFFF" stroke="#121212" stroke-width="3.5"/>
    <circle cx="92" cy="58" r="6" fill="#121212"/>
    <circle cx="94" cy="56" r="2" fill="#FFFFFF"/>

    <!-- Eyebrows (Dynamic & Determined) -->
    <polygon points="56,44 78,50 76,54 54,48" fill="#121212"/>
    <polygon points="86,50 108,44 110,48 88,54" fill="#121212"/>

    <!-- Cheerful Blushing Cheeks -->
    <ellipse cx="54" cy="68" rx="6" ry="3.5" fill="#FCA5A5" opacity="0.7"/>
    <ellipse cx="106" cy="68" rx="6" ry="3.5" fill="#FCA5A5" opacity="0.7"/>

    <!-- Cheerful Smiling Mouth -->
    <path d="M68 76 C68 88 92 88 92 76 Z" fill="#121212" stroke="#121212" stroke-width="2.5"/>
    <path d="M72 76 L88 76 C86 80 74 80 72 76 Z" fill="#FFFFFF"/>
    <path d="M75 82 C78 80 82 80 85 82 C83 85 77 85 75 82 Z" fill="#F472B6"/>

    <!-- Santri Black Peci / Songkok tilted on top of the 'C' -->
    <g transform="translate(68, 4) rotate(-8)">
      <!-- Main Peci body -->
      <path d="M0 24 C2 10 12 2 34 2 C56 2 64 10 66 24 Z" fill="#121212" stroke="#121212" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Peci top crown highlight -->
      <path d="M8 8 C18 4 48 4 58 8" stroke="#3F3F46" stroke-width="2" fill="none"/>
      <!-- Gold / Lime bottom band -->
      <path d="M-1 22 C18 26 48 26 67 22" stroke="#D4FF00" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- Small crescent emblem on Peci -->
      <circle cx="34" cy="11" r="3.5" fill="#F59E0B"/>
      <circle cx="35.5" cy="10.5" r="2.8" fill="#121212"/>
    </g>

    <!-- Floating Sparkles (Barakah) -->
    <g transform="translate(14, 28)">
      <polygon points="6,0 7,4 11,5 7,6 6,10 5,6 1,5 5,4" fill="#D4FF00" stroke="#121212" stroke-width="1.5"/>
    </g>
    <g transform="translate(136, 102)">
      <polygon points="6,0 7,4 11,5 7,6 6,10 5,6 1,5 5,4" fill="#D4FF00" stroke="#121212" stroke-width="1.5"/>
    </g>
  </g>
</svg>
