      C 98 22, 60 20, 36 44
      C 18 64, 18 100, 36 122
      C 56 144, 96 144, 116 125
      C 106 115, 96 120, 80 120
      C 55 120, 44 95, 45 82
      C 46 68, 58 55, 80 55
