<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" fill="none">
  <!-- BQC Bespoke Sticker: Gerbang Babussalam & Kubah Pesantren (Portal of Knowledge) -->
  <defs>
    <filter id="gateBabussalamShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#121212" />
    </filter>
  </defs>

  <g filter="url(#gateBabussalamShadow)">
    <!-- Flanking Minaret Turret Left -->
    <rect x="18" y="44" width="22" height="106" fill="#FFFFFF" stroke="#121212" stroke-width="3.5"/>
    <rect x="14" y="38" width="30" height="8" rx="2" fill="#D4FF00" stroke="#121212" stroke-width="2.5"/>
    <polygon points="20,38 29,18 38,38" fill="#CF2B09" stroke="#121212" stroke-width="2.5"/>
    <circle cx="29" cy="14" r="3" fill="#F59E0B" stroke="#121212" stroke-width="1.5"/>
    <!-- Minaret Window -->
    <path d="M25 64 C25 60 33 60 33 64 L33 76 L25 76 Z" fill="#121212"/>
    <path d="M25 90 C25 86 33 86 33 90 L33 102 L25 102 Z" fill="#121212"/>

    <!-- Flanking Minaret Turret Right -->
    <rect x="120" y="44" width="22" height="106" fill="#FFFFFF" stroke="#121212" stroke-width="3.5"/>
    <rect x="116" y="38" width="30" height="8" rx="2" fill="#D4FF00" stroke="#121212" stroke-width="2.5"/>
    <polygon points="122,38 131,18 140,38" fill="#CF2B09" stroke="#121212" stroke-width="2.5"/>
    <circle cx="131" cy="14" r="3" fill="#F59E0B" stroke="#121212" stroke-width="1.5"/>
    <!-- Minaret Window -->
    <path d="M127 64 C127 60 135 60 135 64 L135 76 L127 76 Z" fill="#121212"/>
    <path d="M127 90 C127 86 135 86 135 90 L135 102 L127 102 Z" fill="#121212"/>

    <!-- Central Grand Dome (Crowning the Portal) -->
    <path d="M50 48 C50 26 66 14 80 10 C94 14 110 26 110 48 Z" fill="#CF2B09" stroke="#121212" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M60 48 C60 30 72 20 80 18 C88 20 100 30 100 48 Z" fill="#F59E0B" stroke="#121212" stroke-width="2"/>
    
    <!-- Grand Crescent & Star Finial on Dome -->
    <g transform="translate(80, 5)">
      <circle cx="0" cy="0" r="5" fill="#D4FF00" stroke="#121212" stroke-width="1.5"/>
      <path d="M1 -3 C-1 -3 -3 -1 -3 0 C-3 1 -1 3 1 3 C2 3 2.8 2.5 3 2 C1.8 2 0.8 1 0.8 0 C0.8 -1 1.8 -2 3 -2 C2.8 -2.5 2 -3 1 -3 Z" fill="#121212"/>
    </g>

    <!-- Main Archway Structure (Central Building) -->
    <rect x="38" y="46" width="84" height="104" fill="#D4FF00" stroke="#121212" stroke-width="4"/>

    <!-- Callout Inscription Plaque above Arch: BQC CAMBA -->
    <rect x="48" y="52" width="64" height="16" rx="3" fill="#121212" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="80" y="64" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="10" fill="#D4FF00" text-anchor="middle" letter-spacing="2">
      BQC CAMBA
    </text>

    <!-- Monumental Horseshoe Arch Portal (Opening) -->
    <!-- Outer Arch Moulding -->
    <path d="M52 150 L52 104 C52 76 64 74 80 74 C96 74 108 76 108 104 L108 150 Z" 
          fill="#FFFDF0" stroke="#121212" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Inner Arch Portal (Glow of Enlightenment Inside) -->
    <path d="M58 150 L58 106 C58 84 68 80 80 80 C92 80 102 84 102 106 L102 150 Z" 
          fill="#CF2B09" stroke="#121212" stroke-width="2.5"/>

    <!-- Sunrise of Knowledge Radiating from the Open Gate -->
    <circle cx="80" cy="150" r="28" fill="#F59E0B"/>
    <circle cx="80" cy="150" r="18" fill="#D4FF00"/>
    <circle cx="80" cy="150" r="8" fill="#FFFFFF"/>

    <!-- Geometric Arabesque Rosette / Rub el Hizb above the Arch -->
    <g transform="translate(80, 92)">
      <rect x="-6" y="-6" width="12" height="12" rx="1.5" fill="#D4FF00" stroke="#121212" stroke-width="1.5"/>
      <rect x="-6" y="-6" width="12" height="12" rx="1.5" fill="#D4FF00" stroke="#121212" stroke-width="1.5" transform="rotate(45)"/>
      <circle cx="0" cy="0" r="3" fill="#121212"/>
    </g>

    <!-- Foundation Plinth Steps -->
    <rect x="10" y="150" width="140" height="10" rx="2" fill="#121212"/>
    <rect x="14" y="152" width="132" height="3" fill="#3F3F46"/>

    <!-- Celestial Sparkles -->
    <polygon points="12,24 13,27 16,28 13,29 12,32 11,29 8,28 11,27" fill="#F59E0B"/>
    <polygon points="148,24 149,27 152,28 149,29 148,32 147,29 144,28 147,27" fill="#F59E0B"/>
  </g>
</svg>
