    <circle cx="23" cy="50" r="6.5" fill="#E53935" stroke="#121212" stroke-width="3.5"/>
    <circle cx="18" cy="68" r="6.5" fill="#E53935" stroke="#121212" stroke-width="3.5"/>
    <circle cx="18" cy="88" r="6.5" fill="#E53935" stroke="#121212" stroke-width="3.5"/>
    <circle cx="23" cy="107" r="6.5" fill="#E53935" stroke="#121212" stroke-width="3.5"/>
    <circle cx="34" cy="123" r="6.5" fill="#E53935" stroke="#121212" stroke-width="3.5"/>
    <circle cx="50" cy="136" r="6.5" fill="#E53935" stroke="#121212" stroke-width="3.5"/>
