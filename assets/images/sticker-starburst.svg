<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- BQC Bespoke Sticker: Mushaf Al-Qur'an di atas Rehal Kayu Ukir -->
  <defs>
    <filter id="quranRehalShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#121212" />
    </filter>
  </defs>

  <g filter="url(#quranRehalShadow)">
    <!-- Wooden Rehal Stand (X-Folded Base) -->
    <!-- Back Leg Right -->
    <path d="M56 64 L78 88 L68 92 L50 72 Z" fill="#8B4513" stroke="#121212" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Back Leg Left -->
    <path d="M44 64 L22 88 L32 92 L50 72 Z" fill="#8B4513" stroke="#121212" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Front Leg Left -->
    <path d="M30 52 L16 86 L26 89 L46 64 Z" fill="#A0522D" stroke="#121212" stroke-width="3" stroke-linejoin="round"/>
    <!-- Front Leg Right -->
    <path d="M70 52 L84 86 L74 89 L54 64 Z" fill="#A0522D" stroke="#121212" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Wooden Carving Ornaments on Rehal Base -->
    <circle cx="50" cy="68" r="3" fill="#D4FF00" stroke="#121212" stroke-width="1.5"/>
    <path d="M24 82 L34 82" stroke="#121212" stroke-width="2" stroke-linecap="round"/>
    <path d="M66 82 L76 82" stroke="#121212" stroke-width="2" stroke-linecap="round"/>

    <!-- Open Qur'an Book Pages (Angled Wings) -->
    <!-- Left Page Base & Thickness -->
    <path d="M12 42 C24 39 40 43 50 48 L50 56 C40 51 24 47 12 50 Z" fill="#FAF7F0" stroke="#121212" stroke-width="3" stroke-linejoin="round"/>
    <!-- Right Page Base & Thickness -->
    <path d="M88 42 C76 39 60 43 50 48 L50 56 C60 51 76 47 88 50 Z" fill="#FAF7F0" stroke="#121212" stroke-width="3" stroke-linejoin="round"/>

    <!-- Left Main Open Page -->
    <path d="M14 24 C28 20 42 25 50 30 L50 48 C42 43 28 38 14 42 Z" fill="#FFFDF5" stroke="#121212" stroke-width="3" stroke-linejoin="round"/>
    <!-- Right Main Open Page -->
    <path d="M86 24 C72 20 58 25 50 30 L50 48 C58 43 72 38 86 42 Z" fill="#FFFDF5" stroke="#121212" stroke-width="3" stroke-linejoin="round"/>

    <!-- Gold Decorative Page Trim / Hilya Border -->
    <path d="M20 27 C30 24 40 27 46 31 L46 44 C40 40 30 37 20 40 Z" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <path d="M80 27 C70 24 60 27 54 31 L54 44 C60 40 70 37 80 40 Z" fill="none" stroke="#F59E0B" stroke-width="1.5"/>

    <!-- Illuminated Quranic Ayat Lines (Left Page) -->
    <line x1="24" y1="31" x2="42" y2="34" stroke="#121212" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="23" y1="35" x2="43" y2="38" stroke="#121212" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="24" y1="39" x2="38" y2="41" stroke="#121212" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Illuminated Quranic Ayat Lines (Right Page) -->
    <line x1="58" y1="34" x2="76" y2="31" stroke="#121212" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="57" y1="38" x2="77" y2="35" stroke="#121212" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="62" y1="41" x2="76" y2="39" stroke="#121212" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Central Spine Shadow -->
    <line x1="50" y1="30" x2="50" y2="48" stroke="#CF2B09" stroke-width="2"/>

    <!-- Silk Bookmark Ribbon Hanging Out -->
    <path d="M50 48 C52 54 48 58 52 66 L48 64 L44 67 L46 58 C47 54 49 50 50 48 Z" fill="#CF2B09" stroke="#121212" stroke-width="1.5"/>

    <!-- Radiant Divine Light Sparkles (Nur Al-Qur'an) -->
    <g transform="translate(50, 12)">
      <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="#D4FF00" stroke="#121212" stroke-width="1.5"/>
    </g>
    <polygon points="18,14 19,16 22,17 19,18 18,21 17,18 14,17 17,16" fill="#F59E0B"/>
    <polygon points="82,14 83,16 86,17 83,18 82,21 81,18 78,17 81,16" fill="#F59E0B"/>
  </g>
</svg>
