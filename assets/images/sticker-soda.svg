<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 110" fill="none">
  <!-- BQC Santri Hydration Tumbler Sticker -->
  <g filter="drop-shadow(3px 3px 0px #121212)">
    <!-- Cap Loop Handle -->
    <path d="M40 8 C48 8 52 14 52 20 L44 20 C44 16 42 14 40 14 C38 14 36 16 36 20 L28 20 C28 14 32 8 40 8 Z" 
          fill="#D4FF00" stroke="#121212" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Screw Cap / Chug Lid -->
    <rect x="26" y="20" width="28" height="10" rx="3" fill="#121212" stroke="#121212" stroke-width="2"/>
    <!-- Lid Grip Ribs -->
    <line x1="33" y1="23" x2="33" y2="27" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="40" y1="23" x2="40" y2="27" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="47" y1="23" x2="47" y2="27" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Neck Ring -->
    <rect x="30" y="30" width="20" height="4" fill="#E4E4E7" stroke="#121212" stroke-width="2"/>

    <!-- Main Tumbler Body -->
    <path d="M22 34 L25 96 C25 101 29 104 34 104 L46 104 C51 104 55 101 55 96 L58 34 Z" 
          fill="#CF2B09" stroke="#121212" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Bottom Protective Silicone Boot (Electric Lime) -->
    <path d="M25 84 L25 96 C25 101 29 104 34 104 L46 104 C51 104 55 101 55 96 L55 84 Z" 
          fill="#D4FF00" stroke="#121212" stroke-width="2.5"/>

    <!-- Water Droplet Icon -->
    <path d="M40 44 C40 44 34 52 34 56 C34 59.3 36.7 62 40 62 C43.3 62 46 59.3 46 56 C46 52 40 44 40 44 Z" 
          fill="#FFFFFF" stroke="#121212" stroke-width="2"/>
    <!-- Water Glint -->
    <circle cx="38" cy="55" r="1.5" fill="#121212"/>

    <!-- Bold BQC Brand Stamp -->
    <text x="40" y="76" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      BQC
    </text>

    <!-- Volume Measurement Marks on side -->
    <line x1="52" y1="44" x2="55" y2="44" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="53" y1="52" x2="55" y2="52" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="52" y1="60" x2="55" y2="60" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="53" y1="68" x2="55" y2="68" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Refreshing Sparkle -->
    <polygon points="14,40 15,43 18,44 15,45 14,48 13,45 10,44 13,43" fill="#D4FF00"/>
    <circle cx="66" cy="50" r="2.5" fill="#D4FF00" stroke="#121212" stroke-width="1.5"/>
  </g>
</svg>
