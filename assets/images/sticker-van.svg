<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" fill="none">
  <!-- Outer Sticker White Halo -->
  <g filter="drop-shadow(3px 3px 0px #121212)">
    <!-- Van Body Base -->
    <path d="M15 65 L15 35 C15 25 25 18 45 16 L125 16 C140 16 150 24 150 40 L150 70 C150 75 145 76 140 76 L130 76 C130 68 122 62 114 62 C106 62 98 68 98 76 L62 76 C62 68 54 62 46 62 C38 62 30 68 30 76 L20 76 C15 76 15 70 15 65 Z" fill="#D4FF00" stroke="#121212" stroke-width="4"/>
    
    <!-- Van Roof Rack & Top Highlight -->
    <rect x="35" y="10" width="90" height="4" rx="2" fill="#121212"/>
    <line x1="50" y1="14" x2="50" y2="16" stroke="#121212" stroke-width="3"/>
    <line x1="110" y1="14" x2="110" y2="16" stroke="#121212" stroke-width="3"/>

    <!-- Windows -->
    <!-- Front Windshield -->
    <path d="M22 34 C25 24 35 22 46 22 L55 22 L55 42 L22 42 Z" fill="#121212"/>
    <!-- Side Windows -->
    <rect x="62" y="22" width="24" height="20" rx="3" fill="#121212"/>
    <rect x="92" y="22" width="24" height="20" rx="3" fill="#121212"/>
    <rect x="122" y="22" width="22" height="20" rx="3" fill="#121212"/>

    <!-- Stripe & Wordmark -->
    <rect x="15" y="46" width="135" height="18" fill="#E53935" stroke="#121212" stroke-width="2"/>
    <text x="32" y="59" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" letter-spacing="1.5">
      KRAKERZ
    </text>

    <!-- Headlight -->
    <circle cx="20" cy="54" r="4" fill="#FFFFFF" stroke="#121212" stroke-width="2"/>

    <!-- Wheels -->
    <circle cx="46" cy="76" r="14" fill="#121212"/>
    <circle cx="46" cy="76" r="6" fill="#FFFFFF" stroke="#121212" stroke-width="2"/>
    
    <circle cx="114" cy="76" r="14" fill="#121212"/>
    <circle cx="114" cy="76" r="6" fill="#FFFFFF" stroke="#121212" stroke-width="2"/>
  </g>
</svg>
