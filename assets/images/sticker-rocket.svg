<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" fill="none">
  <!-- BQC Roket Prestasi & Masa Depan Santri -->
  <g filter="drop-shadow(3px 3px 0px #121212)">
    <g transform="rotate(45 45 45)">
      <!-- Exhaust Flame (Propulsion) -->
      <!-- Outer Red Flame -->
      <polygon points="36,64 45,86 54,64" fill="#CF2B09" stroke="#121212" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Inner Yellow Flame -->
      <polygon points="39,64 45,78 51,64" fill="#F59E0B" stroke="#121212" stroke-width="1.5"/>
      <!-- Inner White Core -->
      <polygon points="42,64 45,72 48,64" fill="#FFFFFF"/>

      <!-- Rocket Engine Thruster Nozzle -->
      <rect x="38" y="62" width="14" height="4" rx="1.5" fill="#121212" stroke="#121212" stroke-width="2"/>

      <!-- Side Booster Fins -->
      <path d="M34 46 L18 64 L34 62 Z" fill="#CF2B09" stroke="#121212" stroke-width="3" stroke-linejoin="round"/>
      <line x1="26" y1="58" x2="33" y2="52" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>

      <path d="M56 46 L72 64 L56 62 Z" fill="#CF2B09" stroke="#121212" stroke-width="3" stroke-linejoin="round"/>
      <line x1="64" y1="58" x2="57" y2="52" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>

      <!-- Main Rocket Fuselage -->
      <path d="M45 8 C34 22 34 50 34 62 L56 62 C56 50 56 22 45 8 Z" 
            fill="#D4FF00" stroke="#121212" stroke-width="3.5" stroke-linejoin="round"/>

      <!-- Nose Cone Tip (Crisp White with Red Band) -->
      <path d="M45 8 C40 15 38 22 38 24 L52 24 C52 22 50 15 45 8 Z" fill="#FFFFFF" stroke="#121212" stroke-width="2.5"/>
      <rect x="36" y="24" width="18" height="3" fill="#CF2B09" stroke="#121212" stroke-width="1.5"/>

      <!-- Porthole Window with Crescent & Star -->
      <circle cx="45" cy="38" r="8" fill="#FFFFFF" stroke="#121212" stroke-width="3"/>
      <!-- Crescent & Star inside porthole -->
      <path d="M46 33 C43 33 41 35 41 38 C41 41 43 43 46 43 C47.5 43 48.5 42.5 49 41.5 C46.5 41.8 44.5 40 44.5 38 C44.5 36 46.5 34.2 49 34.5 C48.5 33.5 47.5 33 46 33 Z" fill="#F59E0B"/>
      <polygon points="48,36 48.5,37 49.5,37.2 48.8,37.8 49,38.8 48.2,38.2 47.4,38.8 47.6,37.8 47,37.2 47.8,37" fill="#F59E0B"/>

      <!-- Fuselage Bottom Accent Line -->
      <line x1="35" y1="54" x2="55" y2="54" stroke="#121212" stroke-width="2"/>
    </g>

    <!-- Star Dust Particles -->
    <circle cx="16" cy="30" r="2.5" fill="#D4FF00" stroke="#121212" stroke-width="1.5"/>
    <polygon points="76,70 77,73 80,74 77,75 76,78 75,75 72,74 75,73" fill="#F59E0B"/>
  </g>
</svg>
