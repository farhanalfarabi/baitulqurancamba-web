<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 80" fill="none">
  <!-- BQC Syiar & Muhadharah Megaphone Sticker -->
  <g filter="drop-shadow(3px 3px 0px #121212)">
    <!-- Sound Waves / Syiar Rays Emitting from Horn (Right Side) -->
    <path d="M72 20 C76 26 78 34 78 40 C78 46 76 54 72 60" stroke="#CF2B09" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M80 14 C85 22 88 31 88 40 C88 49 85 58 80 66" stroke="#D4FF00" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Small Speech Sparkle -->
    <polygon points="76,10 78,13 81,14 78,15 76,18 75,15 72,14 75,13" fill="#F59E0B"/>

    <!-- Handle & Grip -->
    <path d="M36 46 L30 68 C30 71 35 73 39 71 L43 49" fill="#121212" stroke="#121212" stroke-width="2"/>
    <line x1="33" y1="56" x2="39" y2="58" stroke="#D4FF00" stroke-width="1.5"/>
    <line x1="32" y1="62" x2="38" y2="64" stroke="#D4FF00" stroke-width="1.5"/>

    <!-- Megaphone Cone (Body) -->
    <polygon points="28,32 64,16 64,64 28,48" fill="#D4FF00" stroke="#121212" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Center Crimson Stripe on Cone with BQC Monogram -->
    <polygon points="40,26 52,21 52,59 40,54" fill="#CF2B09" stroke="#121212" stroke-width="2"/>
    <text x="46" y="44" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="8" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">BQC</text>

    <!-- Back Cylinder & Microphone Button -->
    <ellipse cx="28" cy="40" rx="6" ry="8" fill="#FFFFFF" stroke="#121212" stroke-width="3"/>
    <rect x="18" y="36" width="6" height="8" rx="2" fill="#121212" stroke="#121212" stroke-width="1.5"/>

    <!-- Horn Front Rim / Mouth Ring -->
    <ellipse cx="64" cy="40" rx="4.5" ry="24" fill="#FFFFFF" stroke="#121212" stroke-width="3.5"/>
    <ellipse cx="64" cy="40" rx="2" ry="16" fill="#121212"/>

    <!-- Top Hanging Loop / Strap -->
    <path d="M32 30 C32 24 44 24 44 26" stroke="#121212" stroke-width="2" fill="none"/>
  </g>
</svg>
