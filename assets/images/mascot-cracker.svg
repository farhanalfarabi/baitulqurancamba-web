<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- BQC Santri Cilik Mascot (Baitul Qur'an Camba) -->
  <defs>
    <filter id="bqcMascotShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#121212" />
    </filter>
  </defs>

  <g filter="url(#bqcMascotShadow)">
    <!-- Legs & Shoes -->
    <g id="legs">
      <!-- Left Leg (Pants) -->
      <path d="M72 165 L66 202" stroke="#121212" stroke-width="12" stroke-linecap="round"/>
      <!-- Left Shoe -->
      <path d="M42 216 C42 204 54 202 66 202 C76 202 82 208 82 216 C82 221 42 221 42 216 Z" fill="#121212" stroke="#121212" stroke-width="3"/>
      <rect x="42" y="215" width="40" height="4" rx="1.5" fill="#FFFFFF" stroke="#121212" stroke-width="2"/>
      <line x1="56" y1="209" x2="68" y2="209" stroke="#D4FF00" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Right Leg (Pants) -->
      <path d="M128 165 L134 202" stroke="#121212" stroke-width="12" stroke-linecap="round"/>
      <!-- Right Shoe -->
      <path d="M118 216 C118 208 124 202 134 202 C146 202 158 204 158 216 C158 221 118 221 118 216 Z" fill="#121212" stroke="#121212" stroke-width="3"/>
      <rect x="118" y="215" width="40" height="4" rx="1.5" fill="#FFFFFF" stroke="#121212" stroke-width="2"/>
      <line x1="132" y1="209" x2="144" y2="209" stroke="#D4FF00" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Torso / Koko Shirt -->
    <g id="torso">
      <!-- Shirt Base -->
      <path d="M60 120 L52 172 C52 175 60 178 100 178 C140 178 148 175 148 172 L140 120 Z" 
            fill="#FFFFFF" stroke="#121212" stroke-width="4" stroke-linejoin="round"/>
      <!-- Shirt Hem & Side Slits -->
      <path d="M52 165 L52 172 C60 178 100 178 100 178 C100 178 140 178 148 172 L148 165" stroke="#121212" stroke-width="3.5" fill="none"/>
      
      <!-- Central Placket -->
      <rect x="96" y="118" width="8" height="46" fill="#F4F4F5" stroke="#121212" stroke-width="2"/>
      <!-- Buttons (Gold) -->
      <circle cx="100" cy="126" r="2.2" fill="#F59E0B" stroke="#121212" stroke-width="1.5"/>
      <circle cx="100" cy="138" r="2.2" fill="#F59E0B" stroke="#121212" stroke-width="1.5"/>
      <circle cx="100" cy="150" r="2.2" fill="#F59E0B" stroke="#121212" stroke-width="1.5"/>

      <!-- Pocket with BQC Monogram -->
      <rect x="68" y="132" width="16" height="18" rx="2" fill="#FAF7F0" stroke="#121212" stroke-width="2"/>
      <path d="M68 137 L84 137" stroke="#121212" stroke-width="1.5"/>
      <circle cx="76" cy="144" r="2.5" fill="#15803D"/>

      <!-- Mandarin Collar -->
      <path d="M84 116 C84 112 92 110 100 110 C108 110 116 112 116 116 L116 122 C108 125 92 125 84 122 Z" 
            fill="#15803D" stroke="#121212" stroke-width="3.5"/>
      <line x1="100" y1="110" x2="100" y2="122" stroke="#121212" stroke-width="2"/>
    </g>

    <!-- Right Arm (Thumbs Up) -->
    <g id="right-arm">
      <!-- Sleeve -->
      <path d="M140 122 L162 136 L154 148 L134 138 Z" fill="#FFFFFF" stroke="#121212" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Forearm -->
      <path d="M156 142 L168 128" stroke="#121212" stroke-width="8" stroke-linecap="round"/>
      <!-- Hand / Thumbs Up -->
      <g transform="translate(162, 106)">
        <!-- Palm -->
        <ellipse cx="12" cy="18" rx="8" ry="7" fill="#FCD3B6" stroke="#121212" stroke-width="3"/>
        <!-- Thumb Up -->
        <rect x="8" y="4" width="7" height="13" rx="3.5" fill="#FCD3B6" stroke="#121212" stroke-width="3"/>
        <!-- Finger details -->
        <line x1="8" y1="17" x2="16" y2="17" stroke="#121212" stroke-width="2"/>
        <line x1="8" y1="21" x2="15" y2="21" stroke="#121212" stroke-width="2"/>
      </g>
    </g>

    <!-- Left Arm & Al-Qur'an Mushaf -->
    <g id="left-arm-quran">
      <!-- Sleeve -->
      <path d="M60 122 L36 138 L44 150 L64 138 Z" fill="#FFFFFF" stroke="#121212" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Hand -->
      <ellipse cx="36" cy="148" rx="7" ry="6" fill="#FCD3B6" stroke="#121212" stroke-width="3"/>

      <!-- Al-Qur'an Mushaf Book -->
      <g transform="translate(14, 134) rotate(-10)">
        <!-- Green Leather Cover -->
        <rect x="0" y="0" width="34" height="42" rx="3" fill="#15803D" stroke="#121212" stroke-width="3"/>
        <!-- Gold Border Emboss -->
        <rect x="3" y="3" width="28" height="36" rx="2" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
        <!-- Center Gold Rub el Hizb (Islamic Star) -->
        <rect x="13" y="17" width="8" height="8" rx="1" fill="#F59E0B" stroke="#121212" stroke-width="1" transform="rotate(45 17 21)"/>
        <!-- Page Thickness Edge -->
        <path d="M34 4 L38 6 L38 40 L34 38 Z" fill="#FFFDF0" stroke="#121212" stroke-width="2"/>
        <!-- Bookmark Ribbon Hanging Out -->
        <path d="M17 40 L17 48 L13 45 L9 48 L9 40" fill="#CF2B09" stroke="#121212" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Head & Face -->
    <g id="head">
      <!-- Neck -->
      <rect x="92" y="104" width="16" height="12" fill="#FCD3B6" stroke="#121212" stroke-width="3"/>

      <!-- Face Contour -->
      <ellipse cx="100" cy="74" rx="34" ry="32" fill="#FEE2D5" stroke="#121212" stroke-width="4"/>

      <!-- Ears -->
      <circle cx="65" cy="76" r="7" fill="#FEE2D5" stroke="#121212" stroke-width="3"/>
      <path d="M66 73 C64 75 64 78 67 79" stroke="#121212" stroke-width="2" fill="none"/>

      <circle cx="135" cy="76" r="7" fill="#FEE2D5" stroke="#121212" stroke-width="3"/>
      <path d="M134 73 C136 75 136 78 133 79" stroke="#121212" stroke-width="2" fill="none"/>

      <!-- Cheeks (Blushing) -->
      <ellipse cx="78" cy="84" rx="6" ry="3.5" fill="#FCA5A5" opacity="0.6"/>
      <ellipse cx="122" cy="84" rx="6" ry="3.5" fill="#FCA5A5" opacity="0.6"/>

      <!-- Big Cartoon Eyes -->
      <!-- Left Eye -->
      <ellipse cx="85" cy="70" rx="7.5" ry="9" fill="#FFFFFF" stroke="#121212" stroke-width="3"/>
      <ellipse cx="87" cy="71" rx="4.5" ry="5.5" fill="#121212"/>
      <circle cx="89" cy="69" r="1.8" fill="#FFFFFF"/>
      <!-- Right Eye -->
      <ellipse cx="115" cy="70" rx="7.5" ry="9" fill="#FFFFFF" stroke="#121212" stroke-width="3"/>
      <ellipse cx="113" cy="71" rx="4.5" ry="5.5" fill="#121212"/>
      <circle cx="115" cy="69" r="1.8" fill="#FFFFFF"/>

      <!-- Friendly Curved Eyebrows -->
      <path d="M78 57 C82 54 88 54 93 57" stroke="#121212" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M107 57 C112 54 118 54 122 57" stroke="#121212" stroke-width="3" stroke-linecap="round" fill="none"/>

      <!-- Cute Nose -->
      <circle cx="100" cy="75" r="2.2" fill="#121212"/>

      <!-- Joyful Smiling Mouth -->
      <path d="M88 83 C88 95 112 95 112 83 Z" fill="#CF2B09" stroke="#121212" stroke-width="3"/>
      <!-- Tongue -->
      <path d="M93 89 C97 86 103 86 107 89 C104 94 96 94 93 89 Z" fill="#F472B6"/>
      <!-- White Teeth -->
      <path d="M90 83 L110 83 C108 86 92 86 90 83 Z" fill="#FFFFFF"/>

      <!-- Hair Front Fringe -->
      <path d="M70 54 Q 78 58 86 54 Q 94 59 100 54 Q 106 59 114 54 Q 122 58 130 54 L130 50 L70 50 Z" fill="#121212"/>

      <!-- Indonesian Black Peci / Songkok -->
      <g id="peci">
        <!-- Main Velvet Crown -->
        <path d="M66 50 C66 32 75 22 100 22 C125 22 134 32 134 50 Z" 
              fill="#121212" stroke="#121212" stroke-width="4" stroke-linejoin="round"/>
        <!-- Peci Top Slope -->
        <path d="M72 32 C82 25 118 25 128 32" stroke="#27272A" stroke-width="3" fill="none"/>
        <!-- Golden Decorative Trim at Peci Rim -->
        <path d="M65 48 C76 52 124 52 135 48" stroke="#D4FF00" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <!-- Tiny BQC Star Badge on Peci -->
        <polygon points="100,28 102,32 106,32 103,35 104,39 100,37 96,39 97,35 94,32 98,32" fill="#F59E0B"/>
      </g>
    </g>

    <!-- Floating Sparkle Accent (Light of Knowledge) -->
    <g transform="translate(150, 24)">
      <path d="M12 0 L14 8 L22 10 L14 12 L12 20 L10 12 L2 10 L10 8 Z" fill="#D4FF00" stroke="#121212" stroke-width="2"/>
    </g>
    <g transform="translate(30, 48)">
      <circle cx="6" cy="6" r="4" fill="#CF2B09" stroke="#121212" stroke-width="2"/>
    </g>
  </g>
</svg>
